# /srv/track-shit/compose.yaml on the VPS (the repo is cloned beside it, in src/). deploy.sh runs it.
services:
  track-shit-web:
    build:
      context: ./src
      dockerfile: deploy/web/Dockerfile
    image: track-shit-web
    restart: unless-stopped
    volumes:
      - ./fdroid/repo:/srv/fdroid/repo:ro   # the F-Droid repo the push hook uploads (android/scripts/publish.sh)
    networks:
      - proxy
      - default   # reaches the backup server as backup:8080, the copy of Open Food Facts as off:8080

  backup:
    build:
      context: ./src
      dockerfile: deploy/backup/Dockerfile
    image: track-shit-backup
    restart: unless-stopped
    volumes:
      - track-shit-backup:/data

  off:
    build:
      context: ./src
      dockerfile: deploy/off/Dockerfile
    image: track-shit-off
    restart: unless-stopped
    volumes:
      - off-data:/data

networks:
  proxy:
    external: true   # the host's reverse proxy

volumes:
  track-shit-backup:
    external: true   # created by hand; compose never deletes it
  off-data: {}       # rebuilt from Open Food Facts' export if lost
